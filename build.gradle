buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group
archivesBaseName = 'kryzorae'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: 'official', version: '1.16.5'
    // 1.16.5 structure registries expose a handful of final/private maps.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                aetherium {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                aetherium {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            // ForgeGradle 5 run tasks force-exit the Gradle process by default.
            // A completed runData then looks like a crashed daemon in CI.
            // Do not force the process exit: let Gradle collect the real status.
            setForceExit false
            // Headless CI runners have finite memory: cap Forge's separate
            // data-generator JVM instead of allowing a second unbounded heap.
            // This is only a development run configuration; not a gameplay cap.
            jvmArgs '-Xms128m', '-Xmx1024m', '-XX:MaxMetaspaceSize=384m'
            args '--mod', 'aetherium', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                aetherium {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Generate the seven native 1.16.5 Citadel NBT rooms on every local build.
// Previously only GitHub Actions generated them; a local gradlew build could
// silently create a JAR without any Citadel templates.
tasks.register('generateCitadelTemplates', Exec) {
    group = 'build'
    description = 'Generate the seven Citadel NBT structure templates before packaging.'
    workingDir projectDir
    def windows = System.getProperty('os.name').toLowerCase().contains('windows')
    def python = System.getenv('PYTHON') ?: (windows ? 'py' : 'python3')
    if (windows && python == 'py') {
        commandLine 'py', '-3', 'tools/generate_citadel_templates.py'
    } else {
        commandLine python, 'tools/generate_citadel_templates.py'
    }
    inputs.file('docs/citadel/rooms.json')
    inputs.file('tools/generate_citadel_templates.py')
    outputs.dir('src/main/resources/data/aetherium/structures/citadel')
}
tasks.named('processResources') {
    dependsOn tasks.named('generateCitadelTemplates')
}

repositories {
    // Optional Curios API repository; no Curios dependency is required by Part 2.
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Curios API is compile-only: the built mod does not bundle or require Curios.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
}

jar {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'Kryzorae Team',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Kryzorae Team'
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
