name: Compilar Kryzorae

on:
  push:
    branches:
      - main
      - fix/boss-attack-visibility
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6.4'

      - name: Expandir y preparar el proyecto
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f build.gradle && -d src/main/java ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            cat Aetherium-source.tar.xz.part{001..009} > "$RUNNER_TEMP/Aetherium-source.tar.xz"
            tar -tJf "$RUNNER_TEMP/Aetherium-source.tar.xz" >/dev/null
            mkdir -p "$RUNNER_TEMP/aetherium-source"
            tar -xJf "$RUNNER_TEMP/Aetherium-source.tar.xz" -C "$RUNNER_TEMP/aetherium-source"

            PROJECT_DIR="$(find "$RUNNER_TEMP/aetherium-source" -type f -name build.gradle -print -quit | xargs -r dirname)"
            if [[ -z "$PROJECT_DIR" ]]; then
              echo "::error::No se encontró build.gradle en el archivo fuente."
              exit 1
            fi

            rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

            git rm -f --ignore-unmatch Aetherium-source.tar.xz.part001 Aetherium-source.tar.xz.part002 Aetherium-source.tar.xz.part003 Aetherium-source.tar.xz.part004 Aetherium-source.tar.xz.part005 Aetherium-source.tar.xz.part006 Aetherium-source.tar.xz.part007 Aetherium-source.tar.xz.part008 Aetherium-source.tar.xz.part009

            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          echo "AETHERIUM_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corregir mappings y compatibilidad Forge 1.16.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          for path in (root / "src/main/java").rglob("*.java"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "import net.minecraftforge.registries.RegistryObject;",
                  "import net.minecraftforge.fml.RegistryObject;"
              )
              text = text.replace(
                  "import net.minecraft.entity.ai.goal.RandomLookAroundGoal;",
                  "import net.minecraft.entity.ai.goal.LookRandomlyGoal;"
              )
              text = text.replace("new RandomLookAroundGoal(", "new LookRandomlyGoal(")
              text = text.replace(
                  "import net.minecraft.entity.boss.BossInfo;",
                  "import net.minecraft.world.BossInfo;"
              )
              text = text.replace(".getAbilities().instabuild", ".abilities.instabuild")

              if path.name == "AetheriumAccessoryItem.java":
                  text = text.replace("import net.minecraft.entity.LivingEntity;\n", "")
                  text = text.replace("import net.minecraftforge.fml.common.Optional;\n", "")
                  text = text.replace("import top.theillusivec4.curios.api.SlotContext;\n", "")
                  text = text.replace("import top.theillusivec4.curios.api.type.capability.ICurioItem;\n", "")
                  text = text.replace(
                      '@Optional.Interface(iface = "top.theillusivec4.curios.api.type.capability.ICurioItem", modid = "curios")\n',
                      ""
                  )
                  text = text.replace(" extends Item implements ICurioItem", " extends Item")
                  text = re.sub(
                      r"\n    /\*\* Allows Curios to equip.*?(?=\n    /\*\* Fallback ability)",
                      "",
                      text,
                      flags=re.S
                  )
                  text = re.sub(r"\n    private static Object getSlotEntity\(.*\n\}", "\n}", text, flags=re.S)

              path.write_text(text, encoding="utf-8")

          tags = root / "src/main/resources/data/curios/tags/items"
          tags.mkdir(parents=True, exist_ok=True)
          (tags / "necklace.json").write_text(
              '{\n  "replace": false,\n  "values": ["aetherium:aetherium_amulet"]\n}\n',
              encoding="utf-8"
          )
          (tags / "ring.json").write_text(
              '{\n  "replace": false,\n  "values": ["aetherium:aetherium_ring"]\n}\n',
              encoding="utf-8"
          )

          wrapper_properties = root / "gradle/wrapper/gradle-wrapper.properties"
          if wrapper_properties.exists():
              wrapper_text = wrapper_properties.read_text(encoding="utf-8")
              wrapper_text = re.sub(
                  r"gradle-[0-9.]+-(?:bin|all)\.zip",
                  "gradle-7.6.4-bin.zip",
                  wrapper_text
              )
              wrapper_properties.write_text(wrapper_text, encoding="utf-8")

          PY

          # The compatibility fixes are strictly local to this CI workspace.
          # Never commit or push changes into main from a pull-request build.

      - name: Preparar codificador de audio
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Generar audio original de Kryzorae
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          python3 -m py_compile tools/generate_aetherium_sounds.py
          python3 tools/generate_aetherium_sounds.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          root = Path('src/main/resources/assets/aetherium')
          sound_events = json.loads((root / 'sounds.json').read_text(encoding='utf-8'))
          for event, definition in sound_events.items():
              for entry in definition.get('sounds', []):
                  name = entry['name'] if isinstance(entry, dict) else entry
                  relative = name.partition(':')[2]
                  path = root / 'sounds' / (relative + '.ogg')
                  if not path.is_file():
                      raise SystemExit('Missing sound: ' + str(path))
                  duration = float(subprocess.check_output([
                      'ffprobe', '-v', 'error', '-show_entries',
                      'format=duration', '-of', 'default=nw=1:nk=1', str(path)
                  ], text=True).strip())
                  if duration < .2:
                      raise SystemExit('Too-short or truncated audio: ' + str(path))
          print('All registered original and existing OGG sound assets were validated.')
          PY

      - name: Compilar mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$AETHERIUM_PROJECT_DIR"
          gradle --version
          # Gradle must generate the Citadel NBTs as a build dependency.
          # Avoid generating them here, so CI catches missing local-build wiring.
          python3 tools/generate_intermediate_equipment_art.py
          python3 tools/generate_custom_armor_art.py
          gradle build --no-daemon
          python3 tools/check_armor_arm_coverage.py
          python3 tools/check_sword_combat.py
          python3 tools/check_boss_redesign.py
          python3 tools/check_boss_balance.py
          python3 tools/check_crimson_combo_resistance.py
          python3 tools/check_boss_stability.py
          python3 tools/check_first_minerals.py
          python3 tools/check_citadel_templates.py
          python3 tools/check_citadel_worldgen.py
          python3 tools/check_approved_visual_assets.py
          python3 tools/check_intermediate_equipment.py
          python3 tools/check_guide_book.py
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import struct
          import zlib

          root = Path('src/main/resources/assets/aetherium')
          events = json.loads((root / 'sounds.json').read_text(encoding='utf-8'))
          sound_files = {
              'assets/aetherium/sounds/' +
              (entry['name'] if isinstance(entry, dict) else entry).split(':', 1)[1] + '.ogg'
              for event in events.values() for entry in event.get('sounds', [])
          }
          jars = [p for p in Path('build/libs').glob('*.jar')
                  if not p.name.endswith('-sources.jar')]
          if not jars:
              raise SystemExit('No compiled mod JAR was found')
          texture_name = 'assets/aetherium/textures/entity/boss/winged_executioner.png'
          for jar in jars:
              with ZipFile(jar) as z:
                  included = set(z.namelist())
                  if texture_name not in included:
                      raise SystemExit(f'{jar} is missing the new Winged Executioner texture')
                  png = z.read(texture_name)
              missing = sound_files - included
              if missing:
                  raise SystemExit(f'{jar} is missing {len(missing)} OGG resources: {sorted(missing)}')
              if 'assets/aetherium/sounds.json' not in included:
                  raise SystemExit(f'{jar} lacks sounds.json')
              if not png.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('Winged Executioner is not a PNG texture')
              width, height = struct.unpack('>II', png[16:24])
              if (width, height) != (128, 128):
                  raise SystemExit(f'Wrong Winged Executioner texture size: {width}x{height}')
              chunks = []
              offset = 8
              while offset + 12 <= len(png):
                  length, = struct.unpack('>I', png[offset:offset + 4])
                  name = png[offset + 4:offset + 8]
                  data = png[offset + 8:offset + 8 + length]
                  expected_crc, = struct.unpack('>I', png[offset + 8 + length:offset + 12 + length])
                  if zlib.crc32(name + data) != expected_crc:
                      raise SystemExit('Winged Executioner PNG has a bad chunk CRC')
                  if name == b'IDAT':
                      chunks.append(data)
                  offset += 12 + length
                  if name == b'IEND':
                      break
              pixels = zlib.decompress(b''.join(chunks))
              if len(pixels) != 128 * 129:
                  raise SystemExit('Winged Executioner PNG pixel data is truncated')
              print(f'Validated 128x128 executioner texture and {len(sound_files)} audio files in {jar.name}')
              # Both tiers must ship real item sprites AND separate worn armor
              # layers. Old 16x16 blue/purple resources must not be mistaken for
              # the new, hand-authored 32x32 designs.
              gear = []
              for tier in ('aetherium', 'astral'):
                  for item in ('sword', 'axe', 'pickaxe',
                               'helmet', 'chestplate', 'leggings', 'boots'):
                      size = (64, 64) if item == 'sword' else (32, 32)
                      gear.append((f'assets/aetherium/textures/item/{tier}_{item}.png', size))
                  for layer in (1, 2):
                      gear.append((f'assets/aetherium/textures/models/armor/{tier}_layer_{layer}.png',
                                   (256, 128)))
              # Also verify the separate 18px harmful-effect inventory icon.
              gear.append(('assets/aetherium/textures/mob_effect/bleeding.png', (18, 18)))
              with ZipFile(jar) as z:
                  for asset, expected_dimensions in gear:
                      if asset not in included:
                          raise SystemExit(f'{jar.name} is missing equipment texture {asset}')
                      data = z.read(asset)
                      if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                          raise SystemExit(f'Invalid equipment PNG signature: {asset}')
                      w, h = struct.unpack('>II', data[16:24])
                      if (w, h) != expected_dimensions:
                          raise SystemExit(f'Wrong equipment dimensions for {asset}: {w}x{h}')
                      # Validate every PNG chunk and the compressed pixel data.
                      pos, compressed, ended = 8, [], False
                      while pos + 12 <= len(data):
                          length, = struct.unpack('>I', data[pos:pos+4])
                          chunk = data[pos+4:pos+8]
                          payload = data[pos+8:pos+8+length]
                          if len(payload) != length or pos + 12 + length > len(data):
                              raise SystemExit(f'Truncated PNG chunk: {asset}')
                          expected_crc, = struct.unpack('>I', data[pos+8+length:pos+12+length])
                          if zlib.crc32(chunk + payload) != expected_crc:
                              raise SystemExit(f'Corrupt PNG chunk: {asset}')
                          if chunk == b'IDAT':
                              compressed.append(payload)
                          pos += 12 + length
                          if chunk == b'IEND':
                              ended = True
                              break
                      if not ended or not compressed:
                          raise SystemExit(f'Missing equipment PNG pixel data: {asset}')
                      pixel_bytes = zlib.decompress(b''.join(compressed))
                      depth, color_type = data[24], data[25]
                      # Sprite art is indexed (with transparency) and worn armor
                      # is indexed opaque. Accept valid 8-bit RGBA too.
                      channels = {2: 3, 3: 1, 6: 4}.get(color_type)
                      if depth != 8 or channels is None:
                          raise SystemExit(f'Unsupported PNG color mode for {asset}: {depth}/{color_type}')
                      if len(pixel_bytes) != h * (1 + w * channels):
                          raise SystemExit(f'Truncated equipment pixel data: {asset}')
              print(f'Validated {len(gear)} weapon, armor and bleeding-icon textures in {jar.name}')
              with ZipFile(jar) as z:
                  for classname in (
                      'com/aetherium/aetherium/content/effect/BleedingEffect.class',
                      'com/aetherium/aetherium/content/projectile/DarkSlashEntity.class',
                      'com/aetherium/aetherium/client/renderer/DarkSlashRenderer.class',
                      'com/aetherium/aetherium/client/renderer/BossMirageRenderer.class',
                      'com/aetherium/aetherium/client/renderer/AetherBoltRenderer.class'):
                      if classname not in included:
                          raise SystemExit(f'Missing new combat class: {classname}')
              print('Validated registered bleeding effect and visible dark slash classes')
              # Prevent the original missing-arm-texture regression: both
              # 256x128 worn-layer atlases must have real pixel-art material
              # variation in the arm and pauldron UV zones.
              with ZipFile(jar) as z:
                  for tier in ('aetherium', 'astral'):
                      name = f'assets/aetherium/textures/models/armor/{tier}_layer_1.png'
                      png = z.read(name)
                      cursor, idat = 8, []
                      while cursor + 12 <= len(png):
                          n, = struct.unpack('>I', png[cursor:cursor+4])
                          tag = png[cursor+4:cursor+8]
                          if tag == b'IDAT':
                              idat.append(png[cursor+8:cursor+8+n])
                          cursor += n + 12
                          if tag == b'IEND':
                              break
                      if png[25] != 3:
                          raise SystemExit(f'Expected indexed armor atlas: {name}')
                      raw = zlib.decompress(b''.join(idat))
                      if any(raw[y * 257] != 0 for y in range(128)):
                          raise SystemExit(f'Unexpected PNG filters in armor atlas: {name}')
                      def uv_colors(x0, y0, x1, y1):
                          return {raw[y*257+1+x] for y in range(y0, y1)
                                  for x in range(x0, x1)}
                      if len(uv_colors(128, 0, 188, 47)) < 8:
                          raise SystemExit(f'Arm UVs are too flat: {name}')
                      if len(uv_colors(128, 64, 190, 121)) < 8:
                          raise SystemExit(f'Pauldron UVs are too flat: {name}')
              print('Validated visible arm and shoulder texture variation in both armor sets')
          PY

      - name: Prueba de arranque de registros en Forge (sin servidor EULA)
        id: forge_startup
        shell: bash
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$AETHERIUM_PROJECT_DIR"
          # Loads mod registries and configured worldgen without starting a server.
          gradle runData --no-daemon --console=plain

      - name: Informar resultado real de prueba de arranque
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.forge_startup.outcome }}" == "success" ]]; then
            echo "Forge runData: PASO" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Forge runData no paso: el JAR compilo, pero el arranque de registros NO ESTA CERTIFICADO. Revisa los logs."
            echo "Forge runData: NO VERIFICADO (revisar logs; no confundir con una prueba exitosa)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir JAR compilado
        uses: actions/upload-artifact@v7
        with:
          name: Kryzorae-jar
          path: ${{ env.AETHERIUM_PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
