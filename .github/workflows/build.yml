name: Compilar Aetherium

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Preparar Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6.4'

      - name: Reconstruir el código fuente
        if: ${{ hashFiles('build.gradle') == '' }}
        shell: bash
        run: |
          set -euo pipefail

          cat Aetherium-source.tar.xz.part{001..009} > "$RUNNER_TEMP/Aetherium-source.tar.xz"

          # Verifica que las nueve partes formen un archivo XZ/TAR válido.
          tar -tJf "$RUNNER_TEMP/Aetherium-source.tar.xz" > /dev/null

          mkdir -p "$RUNNER_TEMP/aetherium-source"
          tar -xJf "$RUNNER_TEMP/Aetherium-source.tar.xz" -C "$RUNNER_TEMP/aetherium-source"

          wrapper="$(find "$RUNNER_TEMP/aetherium-source" -type f -name gradlew -print -quit)"
          if [[ -z "$wrapper" ]]; then
            echo "::error::No se encontró gradlew dentro del paquete fuente."
            exit 1
          fi

          project_dir="$(dirname "$wrapper")"
          echo "AETHERIUM_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Usar fuentes del repositorio
        if: ${{ hashFiles('build.gradle') != '' }}
        shell: bash
        run: |
          echo "AETHERIUM_PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Publicar las fuentes como archivos normales
        if: ${{ hashFiles('build.gradle') == '' }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "$AETHERIUM_PROJECT_DIR/build.gradle"
          test -d "$AETHERIUM_PROJECT_DIR/src/main/java"

          rsync -a --exclude README.md "$AETHERIUM_PROJECT_DIR/" "$GITHUB_WORKSPACE/"

          if [[ -f gradle/wrapper/gradle-wrapper.properties ]]; then
            sed -i 's#gradle-[0-9.]*-bin.zip#gradle-7.6.4-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          fi

          cat > README.md <<'EOF'
# Aetherium

Mod de contenido para **Minecraft 1.16.5** con **Minecraft Forge 36.2.42**.

## Compilar

Requiere JDK 8 de 64 bits.

Windows:

```bat
gradlew.bat build
```

Linux/macOS:

```bash
chmod +x gradlew
./gradlew build
```

El archivo JAR se genera en `build/libs/`.

La compilación automática se ejecuta desde **GitHub Actions** en cada push a `main` y se puede iniciar manualmente desde la pestaña Actions.

## Compatibilidad

- Minecraft 1.16.5 / Forge 36.2.42.
- Java 8.
- Curios es una integración opcional; las funciones que no requieren Curios deben seguir disponibles sin instalarlo.

## Estado

El código se está adaptando y validando con la compilación automática. No considerar el JAR listo para jugar hasta que GitHub Actions termine correctamente y se hagan pruebas dentro del juego.
EOF

          git rm -f Aetherium-source.tar.xz.part001 Aetherium-source.tar.xz.part002 Aetherium-source.tar.xz.part003 Aetherium-source.tar.xz.part004 Aetherium-source.tar.xz.part005 Aetherium-source.tar.xz.part006 Aetherium-source.tar.xz.part007 Aetherium-source.tar.xz.part008 Aetherium-source.tar.xz.part009

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expandir el código fuente del mod en el repositorio"
          git push origin HEAD:main

      - name: Compilar mod con Gradle 7.6.4
        shell: bash
        run: |
          set -euo pipefail
          cd "$AETHERIUM_PROJECT_DIR"
          gradle --version
          gradle build --no-daemon

      - name: Publicar JAR
        uses: actions/upload-artifact@v7
        with:
          name: Aetherium-jar
          path: ${{ env.AETHERIUM_PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
